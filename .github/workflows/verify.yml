name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Add your toolchain setup here (actions/setup-go, setup-node, setup-java...).

      - name: make verify
        run: |
          if [ -f Makefile ] && make -n verify >/dev/null 2>&1; then
            make verify
          else
            echo "::warning::No 'verify' target found in Makefile; nothing to check."
          fi
